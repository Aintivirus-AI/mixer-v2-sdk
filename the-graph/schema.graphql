# -----------------------------
# Frontend-friendly "state" entities
# -----------------------------

type Protocol @entity(immutable: false) {
  id: ID!

  # Factory-wide config
  feeRate: BigInt!
  factoryAddress: Bytes
  stakingAddress: Bytes
  feeCollector: Bytes
  rewardPoolShareBps: BigInt

  # Staking config
  nextSeasonDuration: BigInt!
  currentSeasonId: BigInt!

  # Aggregates (across all pools)
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  depositCount: BigInt!
  withdrawalCount: BigInt!
  totalStaked: BigInt!
  totalClaimed: BigInt!

  updatedBlockNumber: BigInt
  updatedBlockTimestamp: BigInt
  updatedTransactionHash: Bytes
}

type MixerPool @entity(immutable: false) {
  id: ID! # <asset>-<amount>
  asset: Bytes! # address (ETH_ADDRESS or token address)
  amount: BigInt!
  address: Bytes!

  deployedBlockNumber: BigInt!
  deployedBlockTimestamp: BigInt!
  deployedTransactionHash: Bytes!

  # Aggregates for this specific pool (asset + amount)
  totalDeposited: BigInt!
  totalWithdrawn: BigInt!
  depositCount: BigInt!
  withdrawalCount: BigInt!
}

type Deposit @entity(immutable: true) {
  id: Bytes!
  pool: MixerPool!
  commitment: Bytes! # bytes32
  protocolFee: BigInt!
  extraFee: BigInt!
  partnerAddress: Bytes! # address(0) for no partner
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Withdrawal @entity(immutable: true) {
  id: Bytes!
  pool: MixerPool!
  to: Bytes! # address
  nullifierHash: Bytes! # bytes32
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Season @entity(immutable: false) {
  id: ID! # seasonId as string
  seasonId: BigInt!
  start: BigInt!
  end: BigInt!
  duration: BigInt!

  assets: [SeasonAsset!]! @derivedFrom(field: "season")
}

type SeasonAsset @entity(immutable: false) {
  id: ID! # <seasonId>-<asset>
  season: Season!
  asset: Bytes! # address
  # from seasonAndTotals(seasonId, asset)
  duration: BigInt!
  totalStaked: BigInt!
  totalReward: BigInt!
  totalWeight: BigInt!
}

type Staked @entity(immutable: true) {
  id: Bytes!
  staker: Bytes! # address
  seasonAsset: SeasonAsset!
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Unstaked @entity(immutable: true) {
  id: Bytes!
  staker: Bytes! # address
  seasonAsset: SeasonAsset!
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

type Claimed @entity(immutable: true) {
  id: Bytes!
  staker: Bytes! # address
  seasonAsset: SeasonAsset!
  amount: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
}

