  buyer: Bytes! # address
  token: Bytes! # address
  amount: BigInt! # uint256
  timestamp: BigInt! # uint256
  blockNumber: BigInt!
  blockTimestamp: BigInt!
  transactionHash: Bytes!
  isNativeETH: Boolean! # true
}

type TokenUpdated @entity(immutable: true) {
  id: Bytes!
