}

type PaymentStats @entity(immutable: false) {
  id: ID! # "payment-stats"
  contractAddress: Bytes!
  treasuryWallet: Bytes!
  totalVolume: BigInt!
  paymentCount: BigInt!
  updatedBlockNumber: BigInt!
  updatedBlockTimestamp: BigInt!
  updatedTransactionHash: Bytes!
}
