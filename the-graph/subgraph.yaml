specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: AintiVirusFactory
    network: sepolia
    source:
      address: "0xfd93cA27038E8fFE6D329b9c91349F91BAb97A23"
      abi: AintiVirusFactory
      startBlock: 10090204
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - MixerPool
        - Deposit
        - FeeRateUpdated
        - FeeCollectorUpdated
        - FeeConfigUpdated
        - RewardPoolShareUpdated
        - FactoryInitialized
        - MixerDeployed
        - RoleAdminChanged
        - RoleGranted
        - RoleRevoked
        - StakingDeployed
        - PartnerAdded
        - PartnerRemoved
        - PartnerExtraFeeUpdated
        - Withdrawal
        - GiftCardWithdrawal
        - GiftCardEnabledUpdated
        - UnclaimedRewardsClaimed
      abis:
        - name: AintiVirusFactory
          file: ./abis/AintiVirusFactory.json
      eventHandlers:
        - event: Deposit(indexed address,uint256,uint256,uint256,indexed bytes32,indexed address)
          handler: handleDeposit
        - event: FeeRateUpdated(uint256,uint256)
          handler: handleFeeRateUpdated
        - event: FeeCollectorUpdated(indexed address,indexed address)
          handler: handleFeeCollectorUpdated
        - event: RewardPoolShareUpdated(uint256,uint256)
          handler: handleRewardPoolShareUpdated
        - event: FeeConfigUpdated(indexed address,uint256,uint256)
          handler: handleFeeConfigUpdated
        - event: FactoryInitialized(indexed address,uint256,uint256)
          handler: handleFactoryInitialized
        - event: MixerDeployed(indexed address,indexed address,indexed uint256)
          handler: handleMixerDeployed
        - event: RoleAdminChanged(indexed bytes32,indexed bytes32,indexed bytes32)
          handler: handleRoleAdminChanged
        - event: RoleGranted(indexed bytes32,indexed address,indexed address)
          handler: handleRoleGranted
        - event: RoleRevoked(indexed bytes32,indexed address,indexed address)
          handler: handleRoleRevoked
        - event: StakingDeployed(indexed address,indexed address)
          handler: handleStakingDeployed
        - event: PartnerAdded(indexed address,uint256)
          handler: handlePartnerAdded
        - event: PartnerRemoved(indexed address)
          handler: handlePartnerRemoved
        - event: PartnerExtraFeeUpdated(indexed address,uint256)
          handler: handlePartnerExtraFeeUpdated
        - event: Withdrawal(indexed address,uint256,address,bytes32)
          handler: handleWithdrawal
        - event: GiftCardWithdrawal(indexed address,uint256,address,indexed bytes32,bytes32)
          handler: handleGiftCardWithdrawal
        - event: GiftCardEnabledUpdated(indexed address,uint256,bool)
          handler: handleGiftCardEnabledUpdated
        - event: UnclaimedRewardsClaimed(indexed address,indexed uint256,uint256)
          handler: handleUnclaimedRewardsClaimed
      file: ./src/aintivirus-factory.ts
  - kind: ethereum
    name: AintiVirusStaking
    network: sepolia
    source:
      address: "0xE653d16d8dE82e3d508221B82289cEEDF2Fa1b59"
      abi: AintiVirusStaking
      startBlock: 10090204
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Protocol
        - Season
        - SeasonAsset
        - Claimed
        - NextSeasonDurationUpdated
        - RewardAdded
        - SeasonStarted
        - Staked
        - Unstaked
      abis:
        - name: AintiVirusStaking
          file: ./abis/AintiVirusStaking.json
      eventHandlers:
        - event: Claimed(indexed address,indexed uint256,indexed address,uint256)
          handler: handleClaimed
        - event: NextSeasonDurationUpdated(uint256,uint256)
          handler: handleNextSeasonDurationUpdated
        - event: RewardAdded(uint256,indexed address,uint256)
          handler: handleRewardAdded
        - event: SeasonStarted(uint256,uint256,uint256)
          handler: handleSeasonStarted
        - event: Staked(indexed address,indexed uint256,indexed address,uint256)
          handler: handleStaked
        - event: Unstaked(indexed address,indexed address,uint256)
          handler: handleUnstaked
      file: ./src/aintivirus-staking.ts
  - kind: ethereum
    name: AintiVirusPayment
    network: sepolia
    source:
      address: "0x9d309F151185b46AD4D6c68De24fc91ff080cb8A"
      abi: AintiVirusPayment
      startBlock: 10295743
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - TokenUpdated
        - TreasuryUpdated
        - PaymentProcessed
        - PaymentStats
      abis:
        - name: AintiVirusPayment
          file: ./abis/AintiVirusPayment.json
      eventHandlers:
        - event: TokenUpdated(indexed address,bool)
          handler: handleTokenUpdated
        - event: TreasuryUpdated(indexed address,indexed address)
          handler: handleTreasuryUpdated
        - event: PaymentProcessed(indexed bytes32,indexed address,indexed address,uint256,uint256)
          handler: handlePaymentProcessed
      file: ./src/aintivirus-payment.ts
